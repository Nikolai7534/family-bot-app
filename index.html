<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Family App</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

  <!-- DASHBOARD -->
  <div id="screen-dashboard" class="screen active">
    <div class="welcome-card">
      <h2>Welcome Back!</h2>
      <p id="user-greeting">Loading...</p>
      <div class="rocket">🚀</div>
    </div>
    <div class="grid-menu">
      <div class="grid-item bg-blue" onclick="openScreen('screen-notes')">
        <div class="grid-icon">📝</div>
        <div class="grid-label">Notes</div>
      </div>
      <div class="grid-item bg-orange" onclick="openScreen('screen-wishlist')">
        <div class="grid-icon">🎁</div>
        <div class="grid-label">Wishlist</div>
      </div>
      <div class="grid-item bg-green" onclick="openScreen('screen-dev', 'Calendar')">
        <div class="grid-icon">📅</div>
        <div class="grid-label">Calendar</div>
      </div>
      <div class="grid-item bg-purple" onclick="openScreen('screen-dev', 'Tasks')">
        <div class="grid-icon">📋</div>
        <div class="grid-label">Tasks</div>
      </div>
      <div class="grid-item bg-lightblue" onclick="openScreen('screen-dev', 'Finance')">
        <div class="grid-icon">💰</div>
        <div class="grid-label">Finance</div>
      </div>
      <div class="grid-item bg-pink" onclick="openScreen('screen-dev', 'Smart Home')">
        <div class="grid-icon">🏠</div>
        <div class="grid-label">Smart Home</div>
      </div>
      <div class="grid-item bg-gray" onclick="openScreen('screen-dev', 'Settings')">
        <div class="grid-icon">⚙️</div>
        <div class="grid-label">Settings</div>
      </div>
    </div>
  </div>

  <!-- IN DEV SCREEN -->
  <div id="screen-dev" class="screen">
    <div class="nav-header">
      <button class="back-btn" onclick="openScreen('screen-dashboard')">←</button>
      <h2 id="dev-title">Under Construction</h2>
    </div>
    <div style="text-align:center; margin-top: 60px;">
      <div style="font-size: 60px; margin-bottom: 20px;">🚧</div>
      <h3>Module in development</h3>
      <p style="color: rgba(255,255,255,0.5);">This feature will be available later.</p>
    </div>
  </div>

  <!-- NOTES SCREEN -->
  <div id="screen-notes" class="screen">
    <div class="nav-header">
      <button class="back-btn" onclick="openScreen('screen-dashboard')">←</button>
      <h2>Notes</h2>
    </div>
    <div class="tabs">
      <button class="tab-btn active" id="tab-notes-shared" onclick="setNotesTab(true)">Shared</button>
      <button class="tab-btn" id="tab-notes-personal" onclick="setNotesTab(false)">Personal</button>
    </div>
    <div class="create-box">
      <input type="text" id="new-topic" placeholder="New topic name...">
      <button onclick="createTopic()">+</button>
    </div>
    <div id="notes-container"></div>
  </div>

  <!-- WISHLIST SCREEN -->
  <div id="screen-wishlist" class="screen">
    <div class="nav-header">
      <button class="back-btn" onclick="openScreen('screen-dashboard')">←</button>
      <h2>Wishlist</h2>
    </div>
    <div class="tabs">
      <button class="tab-btn active" id="tab-wish-shared" onclick="setWishTab(true)">Shared</button>
      <button class="tab-btn" id="tab-wish-personal" onclick="setWishTab(false)">Personal</button>
    </div>
    <div class="wish-form">
      <input type="text" id="wish-name" class="wish-input" placeholder="Item name (e.g. Dyson V15)">
      <div class="wish-row">
        <input type="text" id="wish-price" class="wish-input" style="flex: 0.8; margin-bottom: 0;" placeholder="Price ($500)">
        <input type="url" id="wish-url" class="wish-input" style="flex: 1.2; margin-bottom: 0;" placeholder="Link (https://...)">
      </div>
      <button class="wish-submit" onclick="createWish()">Add to Wishlist</button>
    </div>
    <div id="wishlist-container"></div>
  </div>

  <!-- LOAD SCRIPTS IN ORDER -->
  <script src="main.js"></script>
  <script src="notes.js"></script>
  <script src="wishlist.js"></script>
</body>
</html>
