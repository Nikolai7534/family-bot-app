<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Заметки</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap');
    
    * { box-sizing: border-box; }
    
    body {
      font-family: 'Nunito', sans-serif;
      margin: 0; 
      padding: 16px;
      /* Сочный темный градиент */
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364); 
      color: #ffffff;
      min-height: 100vh;
    }
    
    .header { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      margin-bottom: 24px; 
    }
    
    h2 { 
      margin: 0; 
      font-weight: 800; 
      font-size: 26px; 
      letter-spacing: 0.5px; 
      text-shadow: 0 2px 4px rgba(0,0,0,0.3); 
    }
    
    .badge {
      background: linear-gradient(135deg, #00c6ff, #0072ff);
      color: white; 
      padding: 6px 14px; 
      border-radius: 20px; 
      font-size: 13px; 
      font-weight: 800;
      box-shadow: 0 4px 15px rgba(0, 114, 255, 0.4);
    }
    
    /* Переключатель вкладок */
    .tabs { 
      display: flex; 
      gap: 8px; 
      margin-bottom: 24px; 
      background: rgba(0,0,0,0.2); 
      padding: 6px; 
      border-radius: 14px; 
    }
    
    .tab-btn {
      flex: 1; 
      padding: 12px; 
      border: none; 
      border-radius: 10px;
      background: transparent; 
      color: rgba(255,255,255,0.5); 
      font-weight: 800; 
      font-size: 15px;
      cursor: pointer; 
      transition: 0.3s;
    }
    
    .tab-btn.active { 
      background: rgba(255,255,255,0.15); 
      color: #fff; 
      box-shadow: 0 4px 10px rgba(0,0,0,0.2); 
    }
    
    /* Поле создания темы */
    .create-box { 
      display: flex; 
      gap: 12px; 
      margin-bottom: 24px; 
    }
    
    .create-box input {
      flex: 1; 
      padding: 14px 16px; 
      border-radius: 14px; 
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.05); 
      color: #fff; 
      outline: none; 
      font-size: 15px; 
      transition: 0.3s;
    }
    
    .create-box input:focus { 
      border-color: #00c6ff; 
      background: rgba(255,255,255,0.1); 
    }
    
    .create-box button {
      padding: 0 22px; 
      border: none; 
      border-radius: 14px; 
      font-size: 22px;
      background: linear-gradient(135deg, #11998e, #38ef7d); 
      color: white; 
      font-weight: bold; 
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(56, 239, 125, 0.4); 
      transition: 0.2s;
    }
    
    .create-box button:active { transform: scale(0.95); }
    
    /* Стеклянные карточки */
    .card {
      background: rgba(255, 255, 255, 0.05); 
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.1); 
      border-radius: 18px; 
      padding: 18px; 
      margin-bottom: 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.2);
    }
    
    .card-header { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      margin-bottom: 16px; 
      border-bottom: 1px solid rgba(255,255,255,0.1); 
      padding-bottom: 12px; 
    }
    
    .card-title { font-weight: 800; font-size: 18px; color: #e0f2fe; }
    
    .del-btn { 
      background: rgba(255, 75, 75, 0.15); 
      border: 1px solid rgba(255, 75, 75, 0.3); 
      color: #ff4b4b; 
      font-size: 12px; 
      font-weight: bold; 
      border-radius: 8px; 
      padding: 6px 12px; 
      cursor: pointer; 
      transition: 0.2s; 
    }
    
    /* Чеклист */
    .list-item { 
      display: flex; 
      align-items: center; 
      padding: 12px 0; 
      border-bottom: 1px solid rgba(255,255,255,0.03); 
      cursor: pointer; 
      transition: 0.2s; 
    }
    
    .list-item:last-child { border-bottom: none; }
    
    .checkbox { 
      width: 24px; 
      height: 24px; 
      border-radius: 6px; 
      border: 2px solid rgba(255,255,255,0.3); 
      margin-right: 14px; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      position: relative; 
      transition: 0.2s; 
    }
    
    .list-item.done .checkbox { background: #00c6ff; border-color: #00c6ff; }
    .list-item.done .checkbox::after { content: '✔'; color: white; font-size: 14px; position: absolute; }
    .list-item.done .item-text { text-decoration: line-through; color: rgba(255,255,255,0.3); }
    .item-text { flex: 1; font-size: 16px; transition: 0.2s; }
    
    /* Добавление пункта в чеклист */
    .add-item-box { display: flex; margin-top: 16px; gap: 8px; }
    .add-item-box input { 
      flex: 1; 
      padding: 12px 14px; 
      border-radius: 12px; 
      border: 1px solid transparent; 
      background: rgba(0,0,0,0.2); 
      color: #fff; 
      outline: none; 
      font-size: 14px; 
    }
    .add-item-box input:focus { border-color: rgba(255,255,255,0.2); }
    
    .add-btn { 
      background: rgba(255,255,255,0.1); 
      color: #fff; 
      border: 1px solid rgba(255,255,255,0.1); 
      border-radius: 12px; 
      padding: 0 18px; 
      font-weight: bold; 
      font-size: 18px;
      cursor: pointer; 
      transition: 0.2s;
    }
    .add-btn:active { background: rgba(255,255,255,0.2); }
    
    .empty-state { 
      text-align: center; 
      color: rgba(255,255,255,0.5); 
      padding: 40px 20px; 
      font-size: 16px; 
    }
  </style>
</head>
<body>
  <div class="header">
    <h2>Заметки</h2>
    <span class="badge" id="user-badge">Загрузка...</span>
  </div>

  <div class="tabs">
    <button class="tab-btn active" id="tab-shared" onclick="setTab(true)">Общие</button>
    <button class="tab-btn" id="tab-personal" onclick="setTab(false)">Личные</button>
  </div>

  <div class="create-box">
    <input type="text" id="new-topic" placeholder="Название новой темы...">
    <button onclick="createTopic()">+</button>
  </div>

  <div id="notes-container"></div>

  <script>
    const API_BASE = "https://profit-effectiveness-diet-effective.trycloudflare.com";

    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    const currentUserId = tg.initDataUnsafe?.user?.id || 547418372;
    const userName = tg.initDataUnsafe?.user?.first_name || "Николай";
    document.getElementById("user-badge").textContent = userName;

    let isSharedTab = true;
    let allNotes = [];

    function setTab(shared) {
      isSharedTab = shared;
      document.getElementById("tab-shared").classList.toggle("active", shared);
      document.getElementById("tab-personal").classList.toggle("active", !shared);
      renderNotes();
    }

    async function fetchNotes() {
      try {
        const res = await fetch(`${API_BASE}/api/notes`, { headers: { "x-user-id": currentUserId } });
        if (res.ok) {
          allNotes = await res.json();
          renderNotes();
        }
      } catch (err) { 
        console.error("Ошибка загрузки:", err); 
      }
    }

    function parseNotes(raw) {
      if (!raw) return [];
      try { return JSON.parse(raw); }
      catch(e) {
        return raw.split(/<br>|\\n|\n/).map(line => ({ text: line.replace(/<[^>]*>?/gm, '').trim(), done: false })).filter(l => l.text);
      }
    }

    function renderNotes() {
      const container = document.getElementById("notes-container");
      container.innerHTML = "";
      const filtered = allNotes.filter(n => n.is_shared === isSharedTab);

      if (filtered.length === 0) {
        container.innerHTML = `<div class="empty-state">Пока пусто. Добавьте новую тему выше ☝️</div>`;
        return;
      }

      filtered.forEach(note => {
        const card = document.createElement("div");
        card.className = "card";
        const items = parseNotes(note.content);

        let itemsHtml = items.map((item, idx) => `
          <div class="list-item ${item.done ? 'done' : ''}" onclick="toggleItem(${note.id}, ${idx})">
            <div class="checkbox"></div>
            <div class="item-text">${escapeHtml(item.text)}</div>
          </div>
        `).join('');

        card.innerHTML = `
          <div class="card-header">
            <span class="card-title">${escapeHtml(note.title)}</span>
            <button class="del-btn" onclick="deleteTopic(${note.id})">Удалить</button>
          </div>
          <div class="items-container">${itemsHtml}</div>
          <div class="add-item-box">
            <input type="text" id="add-input-${note.id}" placeholder="Добавить пункт..." onkeypress="handleEnter(event, ${note.id})">
            <button class="add-btn" onclick="addItem(${note.id})">+</button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    async function saveNoteContent(noteId, items) {
      const contentStr = JSON.stringify(items);
      try {
        await fetch(`${API_BASE}/api/notes/${noteId}`, {
          method: "PUT",
          headers: { "Content-Type": "application/json", "x-user-id": currentUserId },
          body: JSON.stringify({ content: contentStr })
        });
      } catch(e) {}
    }

    async function toggleItem(noteId, itemIdx) {
      const note = allNotes.find(n => n.id === noteId);
      const items = parseNotes(note.content);
      items[itemIdx].done = !items[itemIdx].done;
      note.content = JSON.stringify(items);
      renderNotes(); 
      await saveNoteContent(noteId, items);
    }

    async function addItem(noteId) {
      const input = document.getElementById(`add-input-${noteId}`);
      const text = input.value.trim();
      if (!text) return;
      
      const note = allNotes.find(n => n.id === noteId);
      const items = parseNotes(note.content);
      items.push({ text: text, done: false });
      note.content = JSON.stringify(items);
      input.value = '';
      
      renderNotes();
      await saveNoteContent(noteId, items);
    }

    function handleEnter(e, noteId) {
      if (e.key === 'Enter') addItem(noteId);
    }

    async function createTopic() {
      const input = document.getElementById("new-topic");
      const title = input.value.trim();
      if (!title) return;
      try {
        const res = await fetch(`${API_BASE}/api/notes`, {
          method: "POST",
          headers: { "Content-Type": "application/json", "x-user-id": currentUserId },
          body: JSON.stringify({ title: title, is_shared: isSharedTab, content: "[]" })
        });
        if (res.ok) { 
          input.value = ""; 
          await fetchNotes(); 
        }
      } catch (err) {}
    }

    async function deleteTopic(id) {
      if (!confirm("Точно удалить?")) return;
      try {
        const res = await fetch(`${API_BASE}/api/notes/${id}`, {
          method: "DELETE", headers: { "x-user-id": currentUserId }
        });
        if (res.ok) await fetchNotes();
      } catch (err) {}
    }

    function escapeHtml(text) {
      const div = document.createElement("div");
      div.innerText = text;
      return div.innerHTML;
    }

    fetchNotes();
  </script>
</body>
</html>
