<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Family Notepad</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: var(--tg-theme-bg-color, #121212);
      --card-bg: var(--tg-theme-secondary-bg-color, #1e1e1e);
      --text: var(--tg-theme-text-color, #ffffff);
      --hint: var(--tg-theme-hint-color, #888888);
      --btn: var(--tg-theme-button-color, #2481cc);
      --btn-text: var(--tg-theme-button-text-color, #ffffff);
      --danger: #cf6679;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 16px;
      background-color: var(--bg);
      color: var(--text);
    }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .badge { background-color: var(--btn); color: var(--btn-text); padding: 4px 10px; border-radius: 12px; font-size: 13px; }
    .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
    .tab-btn {
      flex: 1; padding: 10px; border: none; border-radius: 8px;
      background: var(--card-bg); color: var(--hint); font-weight: 600; cursor: pointer;
    }
    .tab-btn.active { background: var(--btn); color: var(--btn-text); }
    .create-box { display: flex; gap: 8px; margin-bottom: 16px; }
    .create-box input {
      flex: 1; padding: 10px 14px; border-radius: 8px; border: 1px solid transparent;
      background: var(--card-bg); color: var(--text); outline: none; font-size: 14px;
    }
    .create-box button {
      padding: 10px 16px; border: none; border-radius: 8px;
      background: var(--btn); color: var(--btn-text); font-weight: bold; cursor: pointer;
    }
    .card { background: var(--card-bg); padding: 14px; border-radius: 10px; margin-bottom: 12px; }
    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 8px; }
    .card-title { font-weight: 600; font-size: 16px; }
    .del-btn { background: none; border: none; color: var(--danger); font-size: 13px; cursor: pointer; padding: 0; }

    /* Дизайн чеклиста */
    .list-item { display: flex; align-items: center; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.05); cursor: pointer; transition: 0.2s; }
    .list-item:last-child { border-bottom: none; }
    .checkbox { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--hint); margin-right: 12px; display: flex; justify-content: center; align-items: center; position: relative; }
    .list-item.done .checkbox { background: var(--btn); border-color: var(--btn); }
    .list-item.done .checkbox::after { content: '✓'; color: white; font-size: 14px; font-weight: bold; position: absolute; }
    .list-item.done .item-text { text-decoration: line-through; color: var(--hint); }
    .item-text { flex: 1; font-size: 15px; word-break: break-word; }

    /* Поле добавления пункта */
    .add-item-box { display: flex; margin-top: 12px; gap: 8px; }
    .add-item-box input { flex: 1; padding: 10px 12px; border-radius: 8px; border: 1px solid transparent; background: rgba(0,0,0,0.15); color: var(--text); outline: none; font-size: 14px; }
    .add-item-box input:focus { border-color: var(--btn); }
    .add-btn { background: var(--btn); color: var(--btn-text); border: none; border-radius: 8px; padding: 0 16px; font-weight: bold; cursor: pointer;}
  </style>
</head>
<body>
  <div class="header">
    <h2 style="margin: 0;">Задачи & Покупки</h2>
    <span class="badge" id="user-badge">Загрузка...</span>
  </div>

  <div class="tabs">
    <button class="tab-btn active" id="tab-shared" onclick="setTab(true)">Общие</button>
    <button class="tab-btn" id="tab-personal" onclick="setTab(false)">Личные</button>
  </div>

  <div class="create-box">
    <input type="text" id="new-topic" placeholder="Название новой темы (Покупки)...">
    <button onclick="createTopic()">+</button>
  </div>

  <div id="notes-container"></div>

  <script>
    // ТВОЙ ТУННЕЛЬ
    const API_BASE = "https://profit-effectiveness-diet-effective.trycloudflare.com";

    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    const currentUserId = tg.initDataUnsafe?.user?.id || 547418372;
    const userName = tg.initDataUnsafe?.user?.first_name || "Nikolai";
    document.getElementById("user-badge").textContent = userName;

    let isSharedTab = true;
    let allNotes = [];

    function setTab(shared) {
      isSharedTab = shared;
      document.getElementById("tab-shared").classList.toggle("active", shared);
      document.getElementById("tab-personal").classList.toggle("active", !shared);
      renderNotes();
    }

    async function fetchNotes() {
      try {
        const res = await fetch(`${API_BASE}/api/notes`, { headers: { "x-user-id": currentUserId } });
        if (res.ok) {
          allNotes = await res.json();
          renderNotes();
        }
      } catch (err) { console.error(err); }
    }

    // Парсер, который спасает старые кривые записи и превращает их в чеклист
    function parseNotes(raw) {
      if (!raw) return [];
      try { return JSON.parse(raw); }
      catch(e) {
        return raw.split(/<br>|\\n|\n/).map(line => ({ text: line.replace(/<[^>]*>?/gm, '').trim(), done: false })).filter(l => l.text);
      }
    }

    function renderNotes() {
      const container = document.getElementById("notes-container");
      container.innerHTML = "";
      const filtered = allNotes.filter(n => n.is_shared === isSharedTab);

      if (filtered.length === 0) {
        container.innerHTML = `<div style="text-align:center; color: var(--hint); margin-top: 30px;">Пока пусто. Добавьте новую тему выше!</div>`;
        return;
      }

      filtered.forEach(note => {
        const card = document.createElement("div");
        card.className = "card";
        const items = parseNotes(note.content);

        let itemsHtml = items.map((item, idx) => `
          <div class="list-item ${item.done ? 'done' : ''}" onclick="toggleItem(${note.id}, ${idx})">
            <div class="checkbox"></div>
            <div class="item-text">${escapeHtml(item.text)}</div>
          </div>
        `).join('');

        card.innerHTML = `
          <div class="card-header">
            <span class="card-title">${escapeHtml(note.title)}</span>
            <button class="del-btn" onclick="deleteTopic(${note.id})">Удалить</button>
          </div>
          <div class="items-container">${itemsHtml}</div>
          <div class="add-item-box">
            <input type="text" id="add-input-${note.id}" placeholder="Добавить пункт..." onkeypress="handleEnter(event, ${note.id})">
            <button class="add-btn" onclick="addItem(${note.id})">+</button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    async function saveNoteContent(noteId, items) {
      const contentStr = JSON.stringify(items);
      try {
        await fetch(`${API_BASE}/api/notes/${noteId}`, {
          method: "PUT",
          headers: { "Content-Type": "application/json", "x-user-id": currentUserId },
          body: JSON.stringify({ content: contentStr })
        });
      } catch(e) {}
    }

    async function toggleItem(noteId, itemIdx) {
      const note = allNotes.find(n => n.id === noteId);
      const items = parseNotes(note.content);
      items[itemIdx].done = !items[itemIdx].done;
      note.content = JSON.stringify(items);
      renderNotes(); // Мгновенное обновление визуала
      await saveNoteContent(noteId, items);
    }

    async function addItem(noteId) {
      const input = document.getElementById(`add-input-${noteId}`);
      const text = input.value.trim();
      if (!text) return;
      const note = allNotes.find(n => n.id === noteId);
      const items = parseNotes(note.content);
      items.push({ text: text, done: false });
      note.content = JSON.stringify(items);
      input.value = '';
      renderNotes();
      await saveNoteContent(noteId, items);
    }

    function handleEnter(e, noteId) {
      if (e.key === 'Enter') addItem(noteId);
    }

    async function createTopic() {
      const input = document.getElementById("new-topic");
      const title = input.value.trim();
      if (!title) return;
      try {
        const res = await fetch(`${API_BASE}/api/notes`, {
          method: "POST",
          headers: { "Content-Type": "application/json", "x-user-id": currentUserId },
          body: JSON.stringify({ title: title, is_shared: isSharedTab, content: "[]" })
        });
        if (res.ok) { input.value = ""; await fetchNotes(); }
      } catch (err) {}
    }

    async function deleteTopic(id) {
      if (!confirm("Точно удалить?")) return;
      try {
        const res = await fetch(`${API_BASE}/api/notes/${id}`, {
          method: "DELETE", headers: { "x-user-id": currentUserId }
        });
        if (res.ok) await fetchNotes();
      } catch (err) {}
    }

    function escapeHtml(text) {
      const div = document.createElement("div");
      div.innerText = text;
      return div.innerHTML;
    }

    fetchNotes();
  </script>
</body>
</html>
